- id: "1"
  title: Add move, attack, and level stats with defaults
  description: >-
    Expose movement type (walk, fly, phase) and distance, attack type (melee, ranged, lobbed, area) and range,
    and level as card stats (CAP-1 stats, CAP-2 stats, CAP-3 of SPEC.md), mapped onto existing speed
    and reach in sdk/entities/entity.coffee. Defaults are walk/2, melee/1, level 1; the new stat rules
    apply only in Practice and Sandbox and legacy modes stay unchanged. Read SPEC.md and its companions first.
- id: "2"
  title: Add the phase movement modifier
  description: >-
    Add a Modifier styled after sdk/modifiers/modifierFlying.coffee that grants fly plus passing through
    enemy units (CAP-1); hole and Wall permissions equal fly. This supersedes the Story 2.4 note against
    a separate Phasing modifier. Read SPEC.md and its companions first.
- id: "3"
  title: Apply attack range to ranged, lobbed, and area attacks
  description: >-
    Ranged attacks follow the range stat along the six hex axes instead of the whole board; lobbed attacks arc over intervening Walls and units and may target any tile within range; area attacks
    explode centered on the attacker with the range stat as radius, excluding allies (CAP-2). Reuse the map
    spec geometry and Wall-blocking rules in map-layout.md and add no separate radius stat.
    Read SPEC.md and its companions first.
- id: "4"
  title: Replace move and attack allowance with action points
  description: >-
    Every unit has 2 action points; move, attack, and ability use cost 1 each in any combination and refresh
    to 2 at the owner's turn start (CAP-6). Exhausted equals 0 points, and summoned units start exhausted
    and gain 2 at the owner's next turn start. Practice and Sandbox only; no action-point UI.
    Read SPEC.md and its companions first.
- id: "5"
  title: Build the hand-slot active ability structure
  description: >-
    Generic per-card ability data with base Lockdown and Cooldown, end-of-owner-turn decrement, use rules,
    slot lifecycle, and death and silence handling (CAP-4); defaults are Lockdown 0 and Cooldown 1, Cooldown
    is always at least 1, and use costs 1 action point and no mana. Dev placeholder is Phoenix Fire with Lockdown 1
    and Cooldown 1 on Cards.Neutral.PlanarScout, and each general's Bloodbound Spell is an ability with Lockdown 2,
    Cooldown 2, no mana, in its existing dedicated slot. Read SPEC.md and active-ability-rules.md first.
- id: "6"
  title: Wire unit and ability card UI into the hand
  description: >-
    Render stat icons (including attack_arc.png for lobbed), level, and the lockdown or cooldown counter using the card_ui phobies_unit and
    phobies_ability layered assets and layout JSON, never the preview PNGs (CAP-5). Stat icons replace keyword
    text, and since the assets are not yet connected to CardNode, verify in the running game.
    Read SPEC.md and active-ability-rules.md first.
- id: "7"
  title: Show the ability card in card detail view
  description: >-
    In the existing card-plus-related-card inspect view, show the ability card where a spell such as Phoenix Fire
    appears for Lantern Fox (CAP-5). Read SPEC.md and active-ability-rules.md first.
