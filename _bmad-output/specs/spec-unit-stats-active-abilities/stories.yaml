- id: "1"
  title: Add move, attack, and level stats with defaults
  description: >-
    Expose movement type (walk, fly, phase) and distance, attack type (melee, ranged, lobbed, area) and range,
    and level as card stats (CAP-1 stats, CAP-2 stats, CAP-3 of SPEC.md), mapped onto existing speed
    and reach in sdk/entities/entity.coffee. Defaults are walk/2, melee/1, level 1; the new stat rules
    apply only in Practice and Sandbox and legacy modes stay unchanged. Read SPEC.md and its companions first.
- id: "2"
  title: Add the phase movement modifier
  description: >-
    Add a Modifier styled after sdk/modifiers/modifierFlying.coffee that grants fly plus passing through
    enemy units (CAP-1); hole and Wall permissions equal fly. This supersedes the Story 2.4 note against
    a separate Phasing modifier. Read SPEC.md and its companions first.
- id: "3"
  title: Apply attack range to ranged, lobbed, and area attacks
  description: >-
    Ranged attacks follow the range stat along the six hex axes instead of the whole board; lobbed attacks arc over intervening Walls and units and may target any tile within range; area attacks
    explode centered on the attacker with the range stat as radius, excluding allies (CAP-2). Reuse the map
    spec geometry and Wall-blocking rules in map-layout.md and add no separate radius stat.
    Read SPEC.md and its companions first.
- id: "4"
  title: Replace move and attack allowance with action points
  description: >-
    Every unit has 2 action points; move, attack, and ability use cost 1 each in any combination and refresh
    to 2 at the owner's turn start (CAP-6). Exhausted equals 0 points, and summoned units start exhausted
    and gain 2 at the owner's next turn start. Practice and Sandbox only; no action-point UI.
    Read SPEC.md and its companions first.
- id: "5"
  title: Build the hand-slot active ability structure
  description: >-
    Generic per-card ability data with base Lockdown and Cooldown, end-of-owner-turn decrement, use rules,
    slot lifecycle, and death and silence handling (CAP-4); defaults are Lockdown 0 and Cooldown 1, Cooldown
    is always at least 1, and use costs 1 action point and no mana. Dev placeholder is Phoenix Fire with Lockdown 1
    and Cooldown 1 on Cards.Neutral.PlanarScout, and each general's Bloodbound Spell is an ability with Lockdown 2,
    Cooldown 2, no mana, in its existing dedicated slot. Read SPEC.md and active-ability-rules.md first.
- id: "6"
  title: Wire unit and ability card UI into the hand
  description: >-
    Render stat icons (including attack_arc.png for lobbed), level, and the lockdown or cooldown counter using the card_ui phobies_unit and
    phobies_ability layered assets and layout JSON, never the preview PNGs (CAP-5). Stat icons replace keyword
    text, and since the assets are not yet connected to CardNode, verify in the running game.
    Read SPEC.md and active-ability-rules.md first.
- id: "7"
  title: Show the ability card in card detail view
  description: >-
    In the existing card-plus-related-card inspect view, show the ability card where a spell such as Phoenix Fire
    appears for Lantern Fox (CAP-5). Read SPEC.md and active-ability-rules.md first.
- id: "8"
  title: Move the General's Bloodbound ability state onto its entity
  description: >-
    Retire Player.signatureAbilityState and its helper methods (AD-7). In version 2 each General carries an
    activeAbility definition (Lockdown 2, Cooldown 2) and a per-entity activeAbilityState created by explicit,
    non-overwriting initialization when the General is placed or the version 2 ruleset is assigned, never in a getter.
    The existing counter decrement at the owner's turn end and the cooldown reset after use run through the entity.
    PlaySignatureCardAction, its validator branch, and getIsSignatureCardActive read the General's state, while the
    action type, the AI calls, the Bloodbound slot UI, and network events stay unchanged (Story 14 unifies them).
    Version 2 snapshots that still carry player-level signature state restore its counters onto the General.
    Version 1 and legacy behavior are unchanged. Read SPEC.md, active-ability-rules.md, and
    ../../planning-artifacts/architecture/architecture-duelyst-2026-10-30/ARCHITECTURE-SPINE.md (AD-7) first.
- id: "9"
  title: Pause ability counters while a unit is silenced
  description: >-
    In version 2, Lockdown and Cooldown do not decrease at the owner's turn end while the unit is silenced, and
    resume from the same values when silence ends; this applies to units and Generals alike (AD-7, active-ability-rules.md).
    Depends on Story 8 so the General uses the same counter path. Read SPEC.md, active-ability-rules.md, and
    ../../planning-artifacts/architecture/architecture-duelyst-2026-10-30/ARCHITECTURE-SPINE.md (AD-7) first.
- id: "10"
  title: Route action-point checks through Entity accessors only
  description: >-
    Remove the action-point branches from ModifierFirstBlood, ModifierPseudoRush, ModifierBuilding,
    ModifierTransformed, SetExhaustionAction, and the move and attack actions and validators, so that only Entity
    accessors decide whether a unit can move or attack and any version check goes through the AD-1 helper (AD-6).
    In version 2 a unit is exhausted exactly when it has zero action points, and refresh runs through the entity
    refresh path at the owner's turn start. Behavior in version 1 and legacy must be identical, and the existing
    tests must pass unchanged. Read SPEC.md and ../../planning-artifacts/architecture/architecture-duelyst-2026-10-30/ARCHITECTURE-SPINE.md (AD-6) first.
- id: "11"
  title: Resolve ranged, lobbed, and area geometry in one shared resolver
  description: >-
    Wall obstruction and target selection are copied across attackRange, spell, and AttackAction._hasAreaDelivery.
    Create one shared SDK resolver for ranged, lobbed, and area target selection, Wall obstruction, the
    target-supporting-Wall exception, and occupant priority, and make attack ranges, spell area effects, area-attack
    units, and AI targeting call it (AD-8). AttackAction must not compute geometry itself; define how
    ModifierBlastAttack units coexist. No gameplay change is intended, so add characterization tests first.
    Read SPEC.md, the map spec, map-layout.md, and ../../planning-artifacts/architecture/architecture-duelyst-2026-10-30/ARCHITECTURE-SPINE.md (AD-8) first.
- id: "12"
  title: Make Phase a keyworded modifier in the style of Flying
  description: >-
    ModifierPhasing duplicates ModifierFlying and lacks the keyword fields (isKeyworded, modifierName,
    keywordDefinition, fx resource, i18n). Rebuild it as a Flying-style keyworded modifier that differs only by
    passing through enemy units (AD-6, CAP-1). Version 2 only. Read SPEC.md and ../../planning-artifacts/architecture/architecture-duelyst-2026-10-30/ARCHITECTURE-SPINE.md (AD-6) first.
- id: "13"
  title: Clean up redundant stat accessors and duplicated card-data keys
  description: >-
    Remove alias getters (getMovementDistance, getAttackRangeValue, getAttackRangeStat) that only forward to
    getSpeed or getReach, replace the fragile hasOwnProperty attackType checks with one stat accessor, define the
    Entity card-data key list once for createCardData and getCardDataKeysForCopy, move the inline require in
    Player.actionUseActiveAbility to the top by resolving the cardEligibility cycle, and drop the
    attackRange._isVersion2Ruleset wrapper in favor of the AD-1 helper. Behavior must not change. Read SPEC.md and
    ../../planning-artifacts/architecture/architecture-duelyst-2026-10-30/ARCHITECTURE-SPINE.md first.
- id: "14"
  title: Unify the General's Bloodbound ability under the active-ability action
  description: >-
    After Story 8, make the General's Bloodbound ability use UseActiveAbilityAction instead of
    PlaySignatureCardAction in version 2 (AD-7), with its effect resolved through the existing spell card and its dedicated Bloodbound slot identified
    separately from hand indices. Port every v2 caller: the server AI (starter_ai, phase_ii_ai, and the phase scoring
    modules), single_player.coffee pointer and tracking logic, app/view/Player.js network events, SignatureCardNode, and the
    game layout reminders. Handle prismatic Generals and a changed signature card. Legacy and version 1 keep
    PlaySignatureCardAction. Read SPEC.md, active-ability-rules.md, and ../../planning-artifacts/architecture/architecture-duelyst-2026-10-30/ARCHITECTURE-SPINE.md (AD-7) first.
- id: "15"
  title: Show hand-slot ability icons and live counters
  description: >-
    Show a deployed unit's ability in its emptied hand slot as the effect spell icon with a live Lockdown or
    Cooldown badge, use it through actionUseActiveAbility, and draw ability faces (including the General's
    Bloodbound card) with only the nonzero live counter. Version 2 only. Read SPEC.md and active-ability-rules.md first.
- id: "16"
  title: Fly and phase follow the movement distance stat
  description: >-
    In version 2, Flying and Phasing only decide what a unit may cross; every unit moves its movement distance
    stat, the stat is shown without the Flying bonus, and movement and attack type keyword text is left out of the
    version 2 unit face. Read SPEC.md first.
- id: "17"
  title: Ranged attacks use center-line geometry with linked-Wall barriers and follow the range stat
  description: >-
    Replace the six-axis rule for version 2 ranged attacks with any tile within the attack range stat whose
    center-to-center line is not blocked by a Wall center or by the line joining two adjacent Walls, and stop the
    Ranged keyword from granting reach in version 2 so the attack range stat is the range shown and used. Lobbed,
    area, spell, legacy, and version 1 stay unchanged. Read stories/17-*.md, SPEC.md, the map spec, and
    ../../planning-artifacts/architecture/architecture-duelyst-2026-10-30/ARCHITECTURE-SPINE.md (AD-8) first.
