<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Phobies unit card asset preview</title>
<style>
  @font-face {font-family:Lato;src:url('../../fonts/Lato-Regular.ttf')}
  @font-face {font-family:Lato;src:url('../../fonts/Lato-Bold.ttf');font-weight:700}
  @font-face {font-family:Trump;src:url('../../fonts/TrumpGothicPro-Bold-webfont.ttf');font-weight:700}
  html,body {margin:0;min-height:100%;background:#193b60}
  canvas {display:block;width:1095px;height:1436px}
</style>
<canvas id="card" width="1095" height="1436"></canvas>
<script src="card-config.js"></script>
<script>
const root = document.querySelector('#card');
const ctx = root.getContext('2d');
const asset = (path) => new Promise((resolve, reject) => {
  const image = new Image(); image.onload = () => resolve(image); image.onerror = reject; image.src = path;
});
const write = (value, x, y, font, color = '#fff', align = 'center') => {
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.font = font;
  ctx.shadowColor = 'rgba(0,5,20,.7)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 3;
  ctx.fillStyle = color; ctx.fillText(String(value), x, y); ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
};
(async () => {
  const cfg = window.CARD_PREVIEW_CONFIG;
  await document.fonts.load('700 52px Lato');
  await document.fonts.load('700 64px Trump');
  const card = cfg.sampleCard;
  const files = {
    frame: cfg.background,
    mana: '../../ui/icon_mana@2x.png',
    rarity: cfg.rarityIcons[card.rarity],
    unit: card.unitAtlas,
    skill: card.skillAtlas,
    shadow: '../../ui/unit_shadow.png',
    attack: cfg.attackIcons[card.attackType], health: 'icons/health@2x.png',
    move: cfg.movementIcons[card.movementType], range: 'icons/range@2x.png',
    hourglass: 'icons/hourglass@2x.png'
  };
  const images = Object.fromEntries(await Promise.all(Object.entries(files).map(async ([key, path]) => [key, await asset(path)])));
  ctx.translate(70, 65);
  ctx.scale(960 / 452, 960 / 452);
  ctx.drawImage(images.frame, 0, 0);
  const rarity = cfg.positions.rarity;
  ctx.drawImage(images.rarity,
    rarity.center[0]-rarity.size[0]/2,
    rarity.center[1]-rarity.size[1]/2,
    ...rarity.size);

  const halo = ctx.createRadialGradient(272, 248, 20, 272, 248, 170);
  halo.addColorStop(0, 'rgba(31,137,168,.16)');
  halo.addColorStop(1, 'rgba(31,137,168,0)');
  ctx.fillStyle = halo;
  ctx.fillRect(120, 100, 300, 300);

  // The shipped Duelyst unit shadow keeps the sprite grounded in the art well.
  const ground = cfg.positions.unitShadow;
  ctx.globalAlpha = .85;
  ctx.drawImage(images.shadow, ground.center[0]-ground.size[0]/2,
    ground.center[1]-ground.size[1]/2, ...ground.size);
  ctx.globalAlpha = 1;
  ctx.drawImage(images.mana, cfg.positions.cost[0]-57, cfg.positions.cost[1]-63, 114, 126);

  // Pixel art is sampled from the shipped sprite atlas, without any AI redraw.
  ctx.imageSmoothingEnabled = false;
  const u = card.unitFrame; const unit = cfg.positions.unitSprite;
  ctx.drawImage(images.unit, u.x, u.y, u.width, u.height,
    unit.center[0]-unit.size[0]/2, unit.center[1]-unit.size[1]/2,
    unit.size[0], unit.size[1]);
  const skill = cfg.positions.skillIcon;
  const skillLeft = skill.center[0]-skill.size[0]/2;
  const skillTop = skill.center[1]-skill.size[1]/2;
  const s = card.skillFrame;
  ctx.drawImage(images.skill, s.x, s.y, s.width, s.height,
    skillLeft, skillTop, ...skill.size);
  ctx.imageSmoothingEnabled = true;

  write(card.cost, ...cfg.positions.cost, '700 38px Trump', '#042558');
  write(card.name, ...cfg.positions.name, '700 24px Lato');
  write('Level ' + card.level, ...cfg.positions.level, '700 13px Lato', '#5fd4ec');
  const stats = [
    [images.attack, card.attack], [images.health, card.health],
    [images.move, card.movementDistance], [images.range, card.range]
  ];
  stats.forEach(([icon, value], index) => {
    const [x, y] = cfg.positions.stats[index];
    ctx.drawImage(icon, x-51, y-17, 35, 35);
    write(value, x, y+1, `700 ${value >= 1000 ? 29 : 35}px Trump`);
  });
  const [cx, cy] = cfg.positions.cooldown.center;
  ctx.drawImage(images.hourglass, cx-18, cy-11, 23, 23);
  write(card.cooldown, cx+12, cy, '700 19px Trump');

  write('Whenever you replace this card,', 226, 488, '19px Lato');
  write('it costs 1 less and gains +1/+1.', 226, 516, '19px Lato');
  window.cardPreviewReady = true;
})().catch(err => {document.body.insertAdjacentHTML('beforeend', '<pre style="color:white">'+err+'</pre>');});
</script>
</html>
